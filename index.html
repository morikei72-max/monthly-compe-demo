## 16. 画面ごとの項目
### スコアを出す（入力）
- 参加番号（文字・必須）
- お名前（文字・必須）
- プレーヤーネーム（文字）
- 日付（日付・必須）
- グロス（数・必須）
- ハンデ（数）
- 生年月日（日付）
- 出し方（選ぶ・選ぶもの：ゴルフ場から／スコアカードの写真／自分で入力）
- メモ（長い文）

### スコアの一覧（1行に出すもの）
- 上の段：プレーヤーネーム・グロス
- 下の段：参加番号・日付・出し方
- 並べ方：日付の新しい順
- 上に「さがす」の欄


### スコアの詳細
- 入力と同じ項目をすべて出す。「直す」と「消す」（消すときは必ず確認）

### エントリー者一覧（別の一覧）
- 氏名（文字・必須・一覧の1行に出す名前）
- 電話番号（文字）
- 一覧は氏名の順。詳細で「直す」と「消す」（消すときは必ず確認）

### 月の順位
- 順位：「ダブルペリア（新ペリア）方式。隠しホールはコース側が毎回決める（当社は触らない）」と伺っています。試作では、その月の一人ごとの一番よいネット（グロス−ハンデ）で並べます。同じネットのとき：「カウントバックは使わず、年齢が上の方を上位にする（パンフレットにも書く）」と伺っています。試作では年齢が上の方を上にしています。何回でも：「回数の制限なし。同じ月に何回も回ったら、その月のベストスコアを使う」と伺っています。
- **発表は本名ではなく、各自が決めたプレーヤーネームで出す。** お客様の画面には本名・年齢を出さない。本部の画面だけ、本名と年齢も出す
- 年齢は生年月日から出す（同じネットは年齢が上の方を上）
- 月に何回回っても参加費は2,000円。その月の一番よいスコアで順位を出す
- 月を切り替えて見られる（‹ 前の月／次の月 ›）。1行に 順位・プレーヤーネーム・ネット・グロス・ハンデ・出した回数
- 上位3人に「景品を渡した」の印（押すと付く・もう一度押すと外れる）
- ハンデの出し方（ペリア方式など）は 21 の答えのとおりに作る。推測で作らない

### 参加の登録（お客様の画面・下から出るシート）
- お名前（本名・必須）・ふりがな・プレーヤーネーム（必須・12字まで。順位の発表に出る名前）・生年月日（必須）・電話（必須）・メールアドレス（必須）・くずはゴルフリンクスの会員番号（任意）・参加の決まり（1人1件）と個人情報の取り扱いへの同意（必須）。住所は集めない
- **1人1件だけ。** 保存する前にサーバーで確かめ、同じものがあれば登録しない：プレーヤーネーム（空白・記号・全角半角・大文字小文字をそろえて比べる）／電話番号（数字だけで比べる）／メールアドレス／お名前＋生年月日

### 参加費のお支払い（月2,000円。何回回っても同じ）
- クレジットカード・PayPay：払うとすぐに参加証が使える（決済会社の画面で払う。カード番号はアプリに通さない）
- 現金：参加番号を大きく出し、フロント（戸津池ゴルフセンター・ゴルフクリエイト）で払ってもらう。選んだ時点で本部にLINEで知らせる。本部が「入金の確認」で押すと参加証が使えるようになり、本人にLINEで知らせる

### 本部（くずはゴルフリンクス・戸津池ゴルフセンター・ゴルフクリエイト）
- **3社で同じデータを見る。** 各社の担当者にログインを分けて渡し、どの会社から見ても同じ登録・支払い・スコア・順位が出る（保存場所は1つ）

### 入口
- くずはゴルフリンクス・戸津池ゴルフセンター・ゴルフクリエイト のLINE（リッチメニュー）に同じアイコンを置く。どこから入っても同じ登録画面・同じ保存場所に入る
- アイコンのリンクに入口の印を付け、登録に「どこから登録したか」を残す（本部で入口ごとに数えられる）

### 広告（本部で管理する）
- 出す場所：月の順位の上（「今月の順位　提供：◯◯」）・月の順位の下・スコアを出したあと・ホームの下。**参加証には出さない**。本部で場所ごとに「出す／出さない」を切り替えられ、「見本を見る」でその画面を広告入りで確かめられる
- LINEの順位発表のお知らせにも、提供の1行を付けられるようにする
- 本部の「広告の管理」：広告主・見出し（20字）・ひとこと（40字）・押したときの住所（https のみ）・画像（任意）・出す場所・毎月の広告料・掲載の開始日と終了日。見出しとひとことは画像に書き込まず、画面の文字として重ねる
- **支払いはクレジットカードの毎月の自動引き落としだけ**（決済会社の定期課金を使う。カード番号はアプリに通さない）。保存すると広告主にカード登録の案内を送り、登録が済んでから掲載を始める。引き落としできなかったら自動で掲載を止めて本部に知らせる。止めるときは引き落としも止める（確認を出す）
- 広告が入っていない場所には「広告掲載募集中」（点線の枠。押すと本部へのお問い合わせ）を出す。順位の上は「提供：募集中」
- 広告ごとに表示回数とタップ数を数え、本部の画面に出す（広告主への報告用）。掲載中の件数と毎月の広告収入の合計を出す

### スコアカードの入力（くずはゴルフリンクス・パー70）
- パー：5・4・3・4・3・4・4・5・3・5・4・3・4・4・3・4・5・3（出典：ウィキペディア（2019年の改修後）。くずはゴルフリンクスで確認前の仮。**作る前に最新のスコアカードで確かめる**）
- 1ホールずつ打数を入れる表（OUT・IN・合計を自動で出す）。18ホールすべて入れないと保存できない
- **写真で読む**：スコアカードの写真を撮ると、AI（画像を読むAI）が打数を読み取って表に入れる。読み取った数字は黄色で出し、本人が見比べて違うところを直してから保存する。読めないときは手で入れる
- 写真を付けたときは保存し、本部がスコアの詳細で打数の表と並べて見られるようにする（写真は必須にしない）
- **ダブルペリアの計算もアプリで行う**：くずはゴルフリンクスが月ごとに隠しホール12を入れる → ハンデ＝（隠しホールの打数の合計×1.5−パー）×0.8、ネット＝グロス−ハンデ。上限と端数の扱いは 21 で確かめる（試作は上限36・小数1けた）

### スコアの扱い（自己申告）
- スコアは自己申告。くずはゴルフリンクスの承認は行わない。お客様が出したスコアはすぐ月の順位に入る
- プレーの証明：スタート前に、くずはゴルフリンクスのフロントで参加証を見せる
- 出し方：カメラでスコアカードを撮る／スマホに保存してある写真から選ぶ（打数を読む）／1ホールずつ手で入れる。写真は必須にしない

### 参加番号でさがす（本部・くずはゴルフリンクス）
- 参加番号（またはお名前・プレーヤーネーム）で、登録の中身・今月の参加費・スコアをまとめて出す

### 毎回自動で参加（クレジットカードのみ）
- 払い方に「クレジットカード（毎回自動で参加）」を足す。決済会社の定期課金を使い、**開催する月の1日に2,000円を自動で引き落とす**（開催しない月は引き落とさない）。引き落としたら参加証がすぐ使える
- 引き落としの前の週にLINEで知らせる。引き落としできなかったら、参加証は「参加費がまだ」にして本人と本部に知らせる
- 参加証の画面で、いつでも「自動の参加をやめる」（確認を出す）。カードで払った人は「次から自動で参加する」を選べる
- 本部は「開催する月」を決める（3〜6か月に1回）。本部の画面に、自動で参加している人の一覧と次の引き落とし日を出す

### お支払いの画面
- 金額（2,000円・何月分）・払い方・自動のときは次の引き落とし日を出してから、決済会社の画面でカードを入れる（カード番号はアプリにも本部にも残さない）。PayPayはPayPayのアプリを開く
- 参加証の画面から「お支払いの記録」（何月分・日付・払い方・状態）と、次の自動の引き落とし日を見られる。領収書はお支払いのたびにメールで送る

### 入金の確認（本部だけの画面）
- 現金の入金待ちの一覧（参加番号・本名・プレーヤーネーム・選んだ時刻）と「入金を確認した」（確認を出す）。確認済みの一覧
- 入金待ちがあるときは、本部のホームの上に「現金の入金待ちが◯件あります」を出す

### 参加証（お客様の画面）
- ゴルフ場の受付で見せる画面。アプリ名・その月・お名前・年齢・プレーヤーネーム・**参加番号（白地に黒の大きな数字。ほかの文字より大きく、くずはの受付で見落とさないように）**・状態（エントリー済み・参加費お支払い済み（払い方）／現金のお支払い待ち／参加費がまだ／今月はまだエントリーしていない）。使えるまでは灰色
- 写真で写したものと見分けられるよう、月ごとに色が変わり、光が流れ、いまの時刻が秒で動く
- お支払い済みの印は、カード・PayPayは決済会社の知らせで自動、現金は本部の「入金の確認」で付く（お客様は付けられない）
- 月が変わったら「今月もエントリーする」
- 受付で何を確かめるか・確かめた印を付けるかは 21 の答えのとおりに作る

### ホーム
- 大きな数字：今月スコアを出した人
- 5つの入口：スコアの一覧／スコアを出す／月の順位／エントリー者一覧／使い方

## 18. Claude Code への指示
- 対象ファイル：新しく作る（動く試作のHTMLを土台にしてよい）
- 作る箇所：15の画面と16の項目。9の規則を守る。7に書いたものは作らない
- 変更後の動き：ホームから15のすべての画面に行けて、戻る先が表のとおり。16の項目を入れて保存でき、一覧と詳細に出る
- 完了の確認方法：15の画面を1つずつ開いて戻る先を確かめる／16の項目をすべて入れて保存し、開き直しても残っているか確かめる／12の「まだ決まっていないこと」は作らずに質問として返す

## 20. 安全の決まり（必ず守る）
- ログイン：使う人を特定できるようにする（メールのリンク、またはパスワード＋二段階の確認）。管理の画面は必ずログインが要る
- 見てよい範囲：データベースは、行ごとに見てよい人を決める（Supabase なら全ての表で RLS をオンにし、決まりを書く）。範囲は 8 の問24のとおり
- 鍵：秘密の鍵（サービスロールキー・APIキー・チャネルシークレットなど）は、画面側のコードや GitHub に入れない。サーバー側（Edge Functions など）の環境変数だけに置く
- 通信：https だけにする
- 入力：受け取った文字は、画面に出す前に必ずエスケープする。データベースへの問い合わせは、文字をつなげて作らない（決められた書き方を使う）
- 試し打ちの制限：ログインや送信は、短い時間に何度も試されたら止める
- 控え：毎日バックアップを取り、戻せることを一度確かめる。消すときは必ず確認を出す（問25の答えのとおり）
- 記録：誰が・いつ・何を変えたかを残す（あとで「言った言わない」にならないように）
- 個人情報：必要な項目だけ集める。個人情報保護法に合わせたプライバシーポリシーを置く
- 伏せる情報：カード番号・口座番号・暗証番号やパスワード・マイナンバーは保存しない
- 写真・動画と文字は分けて持つ（文字を写真に書き込まない。4-15）

### この案件で足す決まり
- お客様が自分で登録する（問19）：メールの確認でなりすましを防ぐ。自分のデータだけが見えて、自分のデータだけが直せるようにする
- カード決済（問22）：カード番号は自分のサーバーに一切通さない（決済会社の画面・部品を使う）。支払いの結果は、決済会社からの知らせ（Webhook）の署名を確かめてから反映する
- LINE（問13）：LINE からの知らせは署名を確かめてから受け付ける。チャネルシークレットとアクセストークンはサーバー側だけに置く

### 公開する前に確かめること
- ログインしていない状態で、全ての画面と API を開いて、何も見えない・書けないこと
- 別の人のアカウントで、他人のデータが見えない・直せないこと
- 画面側のコードと GitHub に、秘密の鍵が入っていないこと（検索して確かめる）
- 入力欄に `<script>` などを入れても、そのまま文字として出ること
- バックアップから戻せること

## 21. 作る前にお客様に確かめること（決まるまで、ここは推測で作らない）
- ［確認済み］［型（大会・順位）］順位は何で決めますか（合計・ネット・ペリア方式など）。ハンデは誰が出しますか
  → 答え：ダブルペリア（新ペリア）方式。隠しホールはコース側が毎回決める（当社は触らない）
- ［確認済み］［型（大会・順位）］同じ成績になったときは、どちらを上にしますか
  → 答え：カウントバックは使わず、年齢が上の方を上位にする（パンフレットにも書く）
- ［確認済み］［型（大会・順位）］1か月に何回でも出せますか。いくつか出したときは、どれを使いますか
  → 答え：回数の制限なし。同じ月に何回も回ったら、その月のベストスコアを使う
- ［確認済み］［型（大会・順位）］スコア（成績）は誰が出しますか（ゴルフ場・本人・スコアカードの写真）
  → 答え：不正防止のため、くずはゴルフリンクスから送ってもらう。スコアカードの写真・自分で入力も入れたい
- ［確認済み］［型（大会・順位）］順位の発表日と、景品の渡し方を教えてください
  → 答え：月末に集計し、15日に発表。15日以降に景品を渡す
- ［確認済み］［型（大会・順位）］参加費はいくらで、どこで払いますか
  → 答え：1人 月2,000円。ゴルフクリエイトか戸津池ゴルフセンターのフロントで払い、そこで登録する
- ［型（大会・順位）］ゴルフ場（会場）の受付では、参加証の何を確かめますか。確かめた印は付けますか
- ［型（大会・順位）］ダブルペリアのハンデの上限と、端数（小数）の扱いを教えてください
- ［型（大会・順位）］スコアカードの各ホールのパーは最新ですか。スコアカードの見本をいただけますか
- ［使う人（問19・問23）］使う人の種類ごとに、使える画面と、できること（見る・入れる・直す・消す）を教えてください
- ［お支払い（問22）］予約（注文）のときにスマホで先に払いますか。お店で払いますか。両方選べるようにしますか
- ［お支払い（問22）］返金はどうしますか
- ［LINE（問13）］LINEでのやり取りの中で受けますか。LINEからこのアプリを開いて入れますか
- 12 の「まだ決まっていないこと」も、同じように確かめる
-->

    terms:["利用規約（案）",[
      ["第1条（このきまりについて）","このきまりは、マンスリーコンペ（以下「本サービス」）を使うときの決まりです。本サービスは、くずはゴルフリンクス・戸津池ゴルフセンター・ゴルフクリエイトの3社の共同企画で、株式会社ケイエスケー　App Create事業部（以下「当社」）が運営します。景品のお渡しは、戸津池ゴルフセンターで行います。"],
      ["第2条（参加できる方）","本サービスは、くずはゴルフリンクスでプレーされる方がご参加いただけます。お一人につき1件だけ登録できます。同じ方が複数の登録をすることはできません。"],
      ["第3条（登録）","登録のときは、お名前・性別・プレーヤーネーム・生年月日・電話番号・メールアドレスを正しく入れてください。プレーヤーネームとメールアドレスは、ほかの方と同じものは使えません。"],
      ["第4条（参加費）","参加費は1か月につき2,000円（税込）です。何回プレーされても、その月の参加費は2,000円のままです。お支払いは、現金・PayPay・クレジットカードから選べます。"],
      ["第5条（返金について）","お支払いいただいた参加費は、返金いたしません。ご体調がすぐれないとき、天候が悪いとき、ご都合が悪くなったときなど、プレーを取りやめられた場合も同じです。参加費は、その月のコンペにお申し込みいただいた時点でお預かりするものとしてお取り扱いします。なお、当社の都合でその月の開催そのものを取りやめたときは、参加費をお返しします。"],
      ["第6条（18ホールをお回りいただくこと）","順位に入るには、18ホールをお回りいただくことが条件です。18ホールに満たないとき（9ホールで終わられたときや、途中でおやめになったとき）は、そのスコアは順位に入りません。この場合も、参加費の返金はいたしません。"],
      ["第7条（参加証）","お支払いが確かめられると、参加証が使えるようになります。参加証は、スタート前に、くずはゴルフリンクスのフロントでお見せください。ほかの方に貸すことはできません。"],
      ["第8条（スコア）","スコアは、アプリからご自身でご記入ください。スコアカードの写真から入れることもできます。アプリに入力されたスコアだけが、月の順位に反映されます。プレーされる日は、スタート前に、くずはゴルフリンクスのフロントで参加証を必ずお見せください。次の場合は、そのスコアは順位に反映されません。フロントで参加証をお見せにならなかった場合（見せ忘れを含みます）。スコアカードを書かれなかった場合。スコアをアプリで提出されなかった場合（出し忘れを含みます）。これらの場合も、参加費の返金はいたしません。スコアの提出の期限は、プレーした日の翌日から数えて3日以内（3日目の夜12時まで）です。期限を過ぎたスコアは、順位に反映されません。成績は、提出した日ではなく、プレーした日の月に入ります（月末にプレーされた分は、翌月に入ってから提出されても、プレーした月の成績になります）。"],
      ["第9条（ズルの禁止）","次のことはできません。実際に打った数と違う数を出すこと（ごまかし・ズル）。プレーしていないのにスコアを出すこと。ほかの方のスコアを勝手に出すこと。ハンデを多くするために、わざと悪いスコアを出すこと。"],
      ["第10条（ズルが分かったとき）","スコアのごまかしが分かったときは、その月の順位からはずし、景品はお渡ししません。すでにお渡しした景品は、お返しいただきます。あわせて、こちらから登録を取り消し（強制的に退会）、以後のご参加をお断りします。このときの参加費はお返しできません。"],
      ["第11条（ルールとマナー）","ゴルフのルールと、ゴルフ場の決まりを守ってプレーしてください。ほかのお客様やお店の方への迷惑になる行いがあった方、ルールやマナーを守っていただけない方のご参加は、ご遠慮ください。"],
      ["第12条（順位と発表）","順位は、その月のいちばんよいネット（グロスからハンデを引いた数）で決まります。同じネットのときは、年齢が上の方を上位とします。月末で締め、発表は翌月5日に、プレーヤーネームで行います。本名は出しません。"],
      ["第13条（景品）","景品は、1位から3位、5位ごとの飛び賞、ブービー賞、協賛企業賞の方にお渡しします。景品の内容と受け取り方は、当社からご案内します。景品を他人に譲ること、換金することはできません。"],
      ["第14条（個人情報）","お預かりした情報は、本サービスの運営のために、3社（くずはゴルフリンクス・戸津池ゴルフセンター・ゴルフクリエイト）で共有します。法律で決められた場合を除き、ほかには渡しません。来場の記録（日時・場所など）は、スコアのごまかしを防ぎ、プレーされたことを確かめるための記録として、3年間保管します。3年を過ぎたものは消去します。"],
      ["第15条（やめるとき）","登録をやめたいときは、いつでもお申し出ください。お支払いが済んだ月の参加費は、お返しできません。"],
      ["第16条（できないこと）","ほかの方になりすますこと、うその情報を入れること、ほかの方の迷惑になることは、おやめください。守られないときは、ご利用をお断りすることがあります。"],
      ["第17条（内容の変更・中止）","天候や設備の都合で、その月の開催そのものを取りやめることがあります。当社がその月の開催そのものを取りやめたときは、その月の参加費をお返しします。ただし、次の場合は、参加費（エントリーフィー）をお返しいたしません。ご自身の健康やご体調の都合でキャンセルされた場合。エントリーされたあと、一度もプレーされなかった場合。プレーの途中で、天候などにより中止になった場合。このきまりの内容は、必要に応じて変えることがあります。変えたときは、アプリの中でお知らせします。"],
      ["第18条（責任）","プレー中のけがや、持ち物の紛失については、当社は責任を負いかねます。通信の不具合でアプリが使えないときも同じです。"],
      ["第19条（お問い合わせ）","本サービスについてのお問い合わせは、株式会社ケイエスケー　App Create事業部（電話 075-748-9986）までお願いします。"]]],
